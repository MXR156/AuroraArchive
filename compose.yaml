services:
  auroraarchive:
    build: .
    image: ghcr.io/mxr156/auroraarchive:latest
    restart: unless-stopped
    stop_grace_period: 2h
    ports: ["8080:80"]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/London}
    volumes: ["./media:/media", "./persistent-config:/config"]
