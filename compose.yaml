services:
  auroraarchive:
    build: .
    image: ghcr.io/mxr156/auroraarchive:latest
    restart: unless-stopped
    ports: ["8080:80"]
    environment:
      APP_NAME: AuroraArchive
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      APP_KEY: ${APP_KEY}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: 7500
      CACHE_STORE: database
      SESSION_DRIVER: database
      MEDIA_ROOT: /media
      AURORAARCHIVE_CONFIG_ROOT: /config
      TZ: Europe/London
    volumes: ["./media:/media", "./persistent-config:/config"]
